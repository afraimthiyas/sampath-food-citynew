name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, unit + e2e tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfc
          POSTGRES_PASSWORD: sfc_password
          POSTGRES_DB: sampath_food_city_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sfc -d sampath_food_city_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sfc:sfc_password@localhost:5432/sampath_food_city_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker (build images and smoke-test the stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through the nginx proxy
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS "http://localhost:8080/api/products?limit=1" | grep -q '"items"'
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@sampathfoodcity.demo","password":"Admin@123"}' | grep -q accessToken
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
