# One command to run everything:   docker compose up --build
#   Storefront + back office  ->  http://localhost:8080
#   API + Swagger docs        ->  http://localhost:3000/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sfc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sfc_password}
      POSTGRES_DB: sampath_food_city
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfc -d sampath_food_city"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sfc:${DB_PASSWORD:-sfc_password}@db:5432/sampath_food_city
      # Demo default only - set a long random JWT_SECRET for anything public.
      JWT_SECRET: ${JWT_SECRET:-demo-only-change-me-before-deploying}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:8080
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
